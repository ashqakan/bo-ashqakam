<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بۆ تاقانەکەی دڵم 💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #070005;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* کەنڤاسەکە هەموو شاشەکە دادەپۆشێت */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            z-index: 100;
            text-align: center;
            transition: opacity 0.4s ease;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 25px;
            color: white;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
        }

        .btn {
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.4);
            transition: transform 0.2s;
            pointer-events: auto;
        }

        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <canvas id="loveCanvas"></canvas>

    <div class="container" id="mainContainer">
        <h2>کلیک لەم دوگمەیە بکە، شاهانەکەم.. ✨❤️</h2>
        <button class="btn" onclick="startRomanticWorld()">بۆ تۆ کلیک بکە</button>
    </div>

    <script>
        const canvas = document.getElementById('loveCanvas');
        const ctx = canvas.getContext('2d');

        // ڕێکخستنی قەبارەی کەنڤاس بەپێی شاشەکە
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        let showCenterText = false;
        let centerTextAlpha = 0;
        let animationActive = false;

        const phrases = ['خۆشم دەوێیت', 'تۆ ژیانی منی', 'I Love You', 'هەناسەکەم', 'تاقانەکەم', '💖'];
        const colors = ['#ff1493', '#ff69b4', '#ff0055', '#ffffff'];

        // پۆلێنکردنی هەر تەنۆکەیەک (وشەیەک)
        class Particle {
            constructor(targetX, targetY) {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.targetX = targetX;
                this.targetY = targetY;
                this.text = phrases[Math.floor(Math.random() * phrases.length)];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.fontSize = Math.floor(Math.random() * 4) + 15;
                this.alpha = 0;
                this.speed = 0.04 + Math.random() * 0.02; // خێرایی جوڵە
                this.angle = (Math.random() - 0.5) * 0.2; // کەمێک لاربونەوە
            }

            update() {
                // بەرەو ئامانج دەچێت بە هێواشی و نەرمی (Lerp)
                this.x += (this.targetX - this.x) * this.speed;
                this.y += (this.targetY - this.y) * this.speed;
                
                if (this.alpha < 1) this.alpha += 0.05;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.font = `bold ${this.fontSize}px 'Segoe UI', Tahoma`;
                ctx.textAlign = 'center';
                ctx.fillText(this.text, 0, 0);
                ctx.restore();
            }
        }

        // بەشی پشتەوە (بارانی دڵەکان پێش کلیک کردن)
        let rainParticles = [];
        function updateBackgroundRain() {
            if (!animationActive && Math.random() < 0.1 && rainParticles.length < 15) {
                rainParticles.push({
                    x: Math.random() * canvas.width,
                    y: -20,
                    text: ['✨', '💖', '❤️'][Math.floor(Math.random() * 3)],
                    speed: Math.random() * 1.5 + 1,
                    alpha: Math.random() * 0.3 + 0.1
                });
            }

            rainParticles.forEach((p, index) => {
                p.y += p.speed;
                if (p.y > canvas.height) rainParticles.splice(index, 1);
                
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.font = "14px 'Segoe UI'";
                ctx.fillStyle = "#ff69b4";
                ctx.fillText(p.text, p.x, p.y);
                ctx.restore();
            });
        }

        // ئەنیمەیشن لووپ (سەرەکی)
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // نوێکردنەوەی بارانی پشتەوە
            updateBackgroundRain();

            // نوێکردنەوەی دڵە گەورەکە
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // نیشاندانی دەقی ناوەڕاست بە نەرمی
            if (showCenterText) {
                if (centerTextAlpha < 1) centerTextAlpha += 0.01;
                ctx.save();
                ctx.globalAlpha = centerTextAlpha;
                ctx.fillStyle = '#ffffff';
                ctx.font = "bold 22px 'Segoe UI'";
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff1493';
                ctx.shadowBlur = 10;
                ctx.fillText('تۆ مانگی منی.. 🌙', canvas.width / 2, canvas.height / 2 - 15);
                ctx.fillText('هەموو دنیای من لە ناو دڵی تۆدایە! 💖', canvas.width / 2, canvas.height / 2 + 20);
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        // دەستپێکردنی لووپەکە لە سەرەتاوە بۆ بارانی پشتەوە
        animate();

        function startRomanticWorld() {
            animationActive = true;
            rainParticles = []; // لادانی بارانەکە بۆ چۆڵکردنی شاشەکە

            // شاردنەوەی دوگمەکە
            const container = document.getElementById('mainContainer');
            container.style.opacity = '0';
            setTimeout(() => container.style.display = 'none', 400);

            // نیشاندانی دەقی ناوەڕاست دوای ٢ چرکە
            setTimeout(() => {
                showCenterText = true;
            }, 2000);

            const totalTexts = 120; 
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const r = canvas.width < 600 ? 11 : 18; // گونجاندن بۆ مۆبایل

            for (let i = 0; i < totalTexts; i++) {
                const angle = (i / totalTexts) * 2 * Math.PI;
                
                // هاوکێشەی دڵ
                const x = centerX + r * 16 * Math.pow(Math.sin(angle), 3);
                const y = centerY - r * (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));

                // دروستکردنی پارتیکڵەکان و پاشەکەوتکردنیان
                setTimeout(() => {
                    particles.push(new Particle(x, y));
                }, Math.random() * 600); // بڵاوبوونەوە بە ڕیتمێکی نەرم لە ناو کاتدا
            }
        }
    </script>
</body>
</html>
