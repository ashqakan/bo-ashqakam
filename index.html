<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بۆ تاقانەکەی دڵم 💖</title>
    <style>
        /* ستایلی گشتی */
        body {
            margin: 0;
            padding: 0;
            background: #0a0005;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        /* بەشی ناوەڕۆکی سەرەتا */
        .container {
            z-index: 100;
            text-align: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.6);
        }

        /* دوگمەکە */
        .btn {
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.4);
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        /* ئۆپتیمایزکردنی دەقە ئەنیمەیشنەکان */
        .love-text {
            position: absolute;
            font-weight: bold;
            pointer-events: none;
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0);
            /* بەکارهێنانی GPU بۆ نەهێشتنی لاگ */
            will-change: transform, top, left, opacity;
            animation: explode 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 10;
        }

        /* ئەنیمەیشنی تەقینەوە و دروستکردنی دڵ بە شێوازێکی سووک */
        @keyframes explode {
            0% {
                top: 50%;
                left: 50%;
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3);
            }
            15% {
                opacity: 1;
            }
            100% {
                top: var(--target-y);
                left: var(--target-x);
                opacity: 0.95;
                transform: translate(-50%, -50%) scale(1) rotate(var(--rot));
            }
        }

        /* بارانی پشتەوەی سووککراو */
        .background-element {
            position: absolute;
            top: -20px;
            pointer-events: none;
            will-change: top, transform;
            animation: fall var(--fall-duration) linear infinite;
            opacity: var(--opacity);
            z-index: 1;
        }

        @keyframes fall {
            0% { top: -20px; transform: translateX(0) rotate(0deg); }
            100% { top: 105vh; transform: translateX(var(--drift)) rotate(180deg); }
        }

        /* نامەی ناوەڕاستی دڵەکە */
        .center-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 15px #ff1493;
            opacity: 0;
            z-index: 50;
            pointer-events: none;
            text-align: center;
            line-height: 1.6;
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
        }

        .center-message.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <!-- مۆسیقای پاشبنەما -->
    <audio id="loveMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>

    <div class="container" id="mainContainer">
        <h2>کلیک لەم دوگمەیە بکە، شاهانەکەم.. ✨❤️</h2>
        <button class="btn" onclick="startRomanticWorld()">بۆ تۆ کلیک بکە</button>
    </div>

    <div class="center-message" id="romanticMessage">
        تۆ مانگی منی.. 🌙<br>
        هەموو دنیای من لە ناو دڵی تۆدایە! 💖
    </div>

    <script>
        // بارانی پشتەوە بە ڕیتمێکی هێواشتر بۆ پاراستنی هێزی ئامێرەکە
        function createBackgroundRain() {
            const elements = ['✨', '💖', '❤️', '🌸'];
            setInterval(() => {
                // ئەگەر پەڕەکە زۆر قەرەباڵغ بوو چیتر دروست ناکات
                if (document.querySelectorAll('.background-element').length > 15) return;

                const el = document.createElement('div');
                el.classList.add('background-element');
                el.innerText = elements[Math.floor(Math.random() * elements.length)];
                
                el.style.left = Math.random() * window.innerWidth + 'px';
                el.style.setProperty('--fall-duration', (Math.random() * 3 + 5) + 's');
                el.style.setProperty('--opacity', Math.random() * 0.4 + 0.1);
                el.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
                el.style.fontSize = (Math.random() * 12 + 10) + 'px';

                document.body.appendChild(el);
                setTimeout(() => el.remove(), 7000);
            }, 600); // کاتەکەی درێژتر کراوەتەوە بۆ ڕێگری لە لاگ
        }

        createBackgroundRain();

        function startRomanticWorld() {
            const music = document.getElementById('loveMusic');
            music.play().catch(() => {});

            const container = document.getElementById('mainContainer');
            container.style.opacity = '0';
            container.style.transform = 'scale(0.9)';
            setTimeout(() => container.style.display = 'none', 500);

            setTimeout(() => {
                document.getElementById('romanticMessage').classList.add('show');
            }, 2000);

            const totalTexts = 100; // کەمکرایەوە بۆ ١٠٠ بۆ خێراییەکی بێوێنە
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // دروستکردنی فڕاگمێنت بۆ ئەوەی هەموو دەقەکان بە یەکجار لکێنرێن بە ماڵپەڕەکەوە (ئەمە لاگ ناهێڵێت)
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < totalTexts; i++) {
                const textNode = document.createElement('div');
                textNode.classList.add('love-text');
                
                const romanticPhrases = ['خۆشم دەوێیت', 'تۆ ژیانی منی', 'I Love You', 'هەناسەکەم', 'تاقانەکەم', '💖'];
                textNode.innerText = romanticPhrases[Math.floor(Math.random() * romanticPhrases.length)];

                const angle = (i / totalTexts) * 2 * Math.PI;
                const r = window.innerWidth < 600 ? 12 : 20; // قەبارەی دڵەکە وەک خۆی گەورەیە
                
                const x = centerX + r * 16 * Math.pow(Math.sin(angle), 3);
                const y = centerY - r * (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));

                textNode.style.setProperty('--target-x', `${x}px`);
                textNode.style.setProperty('--target-y', `${y}px`);
                textNode.style.setProperty('--delay', `${Math.random() * 0.4}s`); // کاتی بڵاوبوونەوە خێراتر کرا
                textNode.style.setProperty('--rot', `${(Math.random() - 0.5) * 15}deg`);

                // قەبارەی فۆنتەکە کەمێک گەورەتر کرا تا چڕی دڵەکە کەم نەبێتەوە
                textNode.style.fontSize = `${Math.floor(Math.random() * 6) + 16}px`;

                const colors = ['#ff1493', '#ff69b4', '#ff0055', '#ffffff'];
                textNode.style.color = colors[Math.floor(Math.random() * colors.length)];

                fragment.appendChild(textNode);
            }

            // لکاندنی هەموو دەقەکان بە یەک چرکە لە کاتدا
            document.body.appendChild(fragment);
        }
    </script>
</body>
</html>
