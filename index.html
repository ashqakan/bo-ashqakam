<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بۆ تاقانەکەی دڵم 💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #070005;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        .container {
            z-index: 100;
            text-align: center;
            transition: opacity 0.4s ease;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
        }

        .btn {
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.4);
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        /* بەشی دەقەکان - ئۆپتیمایزکراوی تەواو */
        .love-text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-weight: bold;
            pointer-events: none;
            white-space: nowrap;
            opacity: 0;
            /* بەکارهێنانی translate3d بۆ ڕەوانەکردنی فەرمانەکان بۆ کارتی شاشە */
            transform: translate3d(-50%, -50%, 0) scale(0);
            will-change: transform, opacity;
            animation: explodeSuperFast 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 10;
        }

        @keyframes explodeSuperFast {
            0% {
                transform: translate3d(-50%, -50%, 0) scale(0.2);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translate3d(var(--tx), var(--ty), 0) scale(1) rotate(var(--rot));
                opacity: 0.95;
            }
        }

        /* بارانی پشتەوەی زۆر سووک */
        .background-element {
            position: absolute;
            top: -20px;
            pointer-events: none;
            will-change: transform;
            animation: fall var(--fall-duration) linear infinite;
            opacity: var(--opacity);
            z-index: 1;
        }

        @keyframes fall {
            0% { transform: translate3d(0, -20px, 0) rotate(0deg); }
            100% { transform: translate3d(var(--drift), 105vh, 0) rotate(180deg); }
        }

        .center-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate3d(-50%, -50%, 0) scale(0.8);
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 15px #ff1493;
            opacity: 0;
            z-index: 50;
            pointer-events: none;
            text-align: center;
            line-height: 1.6;
            transition: opacity 1s ease, transform 1s ease;
        }

        .center-message.show {
            opacity: 1;
            transform: translate3d(-50%, -50%, 0) scale(1);
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h2>کلیک لەم دوگمەیە بکە، شاهانەکەم.. ✨❤️</h2>
        <button class="btn" onclick="startRomanticWorld()">بۆ تۆ کلیک بکە</button>
    </div>

    <div class="center-message" id="romanticMessage">
        تۆ مانگی منی.. 🌙<br>
        هەموو دنیای من لە ناو دڵی تۆدایە! 💖
    </div>

    <script>
        // بارانی پشتەوەی زۆر سووک کراو بۆ ئەوەی ڕام داگیر نەکات
        function createBackgroundRain() {
            const elements = ['✨', '💖', '❤️'];
            setInterval(() => {
                if (document.querySelectorAll('.background-element').length > 10) return;

                const el = document.createElement('div');
                el.classList.add('background-element');
                el.innerText = elements[Math.floor(Math.random() * elements.length)];
                
                el.style.left = Math.random() * window.innerWidth + 'px';
                el.style.setProperty('--fall-duration', (Math.random() * 3 + 5) + 's');
                el.style.setProperty('--opacity', Math.random() * 0.3 + 0.1);
                el.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
                el.style.fontSize = '12px';

                document.body.appendChild(el);
                setTimeout(() => el.remove(), 7000);
            }, 800);
        }

        createBackgroundRain();

        function startRomanticWorld() {
            const container = document.getElementById('mainContainer');
            container.style.opacity = '0';
            setTimeout(() => container.style.display = 'none', 400);

            setTimeout(() => {
                document.getElementById('romanticMessage').classList.add('show');
            }, 1400);

            const totalTexts = 90; // ژمارەیەکی گونجاو بۆ دروستکردنی دڵێکی ڕێک بێ ئەوەی لاگ بکات
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < totalTexts; i++) {
                const textNode = document.createElement('div');
                textNode.classList.add('love-text');
                
                const romanticPhrases = ['خۆشم دەوێیت', 'تۆ ژیانی منی', 'I Love You', 'هەناسەکەم', 'تاقانەکەم', '💖'];
                textNode.innerText = romanticPhrases[Math.floor(Math.random() * romanticPhrases.length)];

                const angle = (i / totalTexts) * 2 * Math.PI;
                const r = window.innerWidth < 600 ? 11 : 18; 
                
                // لێرەدا لادانی (Offset) ناوەڕاست حیساب دەکەین لە جیاتی Absolute top/left
                const x = r * 16 * Math.pow(Math.sin(angle), 3);
                const y = -r * (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));

                // بەکارهێنانی نیشاندەرەکانی لادان لە ناو transform
                textNode.style.setProperty('--tx', `calc(-50% + ${x}px)`);
                textNode.style.setProperty('--ty', `calc(-50% + ${y}px)`);
                textNode.style.setProperty('--rot', `${(Math.random() - 0.5) * 15}deg`);
                textNode.style.animationDelay = `${Math.random() * 0.3}s`;

                textNode.style.fontSize = `${Math.floor(Math.random() * 4) + 15}px`;

                const colors = ['#ff1493', '#ff69b4', '#ff0055', '#ffffff'];
                textNode.style.color = colors[Math.floor(Math.random() * colors.length)];

                fragment.appendChild(textNode);
            }

            document.body.appendChild(fragment);
        }
    </script>
</body>
</html>
